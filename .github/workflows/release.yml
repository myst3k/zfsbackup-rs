name: release

# Tag a release to publish static binaries:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Dynamically linked against glibc, pinned to 2.28 so the binaries
          # run on any distro from roughly 2018 on. `target` names the artifact;
          # `build` is what zig compiles against (the .2.28 sets the glibc floor).
          - target: x86_64-unknown-linux-gnu
            build: x86_64-unknown-linux-gnu.2.28
          - target: aarch64-unknown-linux-gnu
            build: aarch64-unknown-linux-gnu.2.28
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install zig + cargo-zigbuild
        run: |
          pip install ziglang==0.13.0
          cargo install cargo-zigbuild --locked
      - name: build
        run: cargo zigbuild --release --locked --target ${{ matrix.build }}
      - name: package
        run: |
          set -e
          name=zfsbackup-rs-${{ github.ref_name }}-${{ matrix.target }}
          install -Dm755 target/${{ matrix.target }}/release/zfsbackup-rs "$name/zfsbackup-rs"
          install -Dm644 README.md LICENSE-MIT LICENSE-APACHE -t "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
          generate_release_notes: true
