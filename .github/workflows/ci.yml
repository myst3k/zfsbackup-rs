name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  # End to end on every push: a real ZFS pool on one side, a real S3
  # implementation on the other, and the actual binary in between. No mocks,
  # no credentials, nothing to keep in sync with production.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: zfs pool on a file vdev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zfsutils-linux
          zfs version
          truncate -s 1G /tmp/vdev
          sudo zpool create citank /tmp/vdev
          sudo zfs create citank/data
          sudo dd if=/dev/urandom of=/citank/data/one bs=1M count=24 status=none
          sudo zfs snapshot citank/data@a
          sudo dd if=/dev/urandom of=/citank/data/two bs=1M count=16 status=none
          sudo zfs snapshot citank/data@b

      - name: minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=citest -e MINIO_ROOT_PASSWORD=citestsecret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && break || sleep 2
          done
          AWS_ACCESS_KEY_ID=citest AWS_SECRET_ACCESS_KEY=citestsecret \
            aws --endpoint-url http://localhost:9000 --region us-east-1 \
            s3 mb s3://backups

      - name: round trip
        env:
          AWS_ACCESS_KEY_ID: citest
          AWS_SECRET_ACCESS_KEY: citestsecret
          ZB_ENDPOINT: http://localhost:9000
          ZB_REGION: us-east-1
          ZB_ALLOW_HTTP: "1"
        run: |
          set -eux
          B="sudo -E ./target/release/zfsbackup-rs"
          U=s3://backups

          # An endpoint that ignores CRC32C must still be usable.
          $B check $U || true

          $B send citank/data@a $U
          $B send citank/data@b $U          # incremental, base found automatically
          $B send citank/data@b $U | grep -q "already archived"
          $B list $U | grep -q "citank/data@b"
          $B verify citank/data@b $U

          $B receive citank/data@b $U citank/restored
          sudo zfs mount citank/restored
          sudo cmp /citank/data/.zfs/snapshot/b/one /citank/restored/one
          sudo cmp /citank/data/.zfs/snapshot/b/two /citank/restored/two

          # Keeping the newest keeps the base it depends on: a chain of two
          # under --keep-last 1 must delete nothing at all.
          $B retention $U --keep-last 1 --dry-run | grep -q "nothing to delete"

          # An independent full makes that chain expendable, and what
          # survives must still restore.
          sudo zfs snapshot citank/data@c
          $B send citank/data@c $U --full
          $B retention $U --keep-last 1 | grep -q "deleted: 2 snapshot"
          ! $B list $U | grep -q "citank/data@a"
          $B verify citank/data@c $U

          # The deleted chain's chunks are gone, so there is nothing to collect.
          $B clean $U --dry-run | grep -q "nothing to clean"

          # Bad input reports, never panics.
          ! $B retention $U --older-than 90д 2>&1 | grep -q panicked
          ! $B send citank/data@a $U --chunk-size 8GiB 2>&1 | grep -q panicked

      - name: logs on failure
        if: failure()
        run: docker logs minio | tail -40
      - name: cleanup
        if: always()
        run: |
          docker rm -f minio || true
          sudo zpool destroy citank || true
