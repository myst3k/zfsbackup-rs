[package]
name = "zfsbackup-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Back up zfs send streams to S3-compatible storage: chunked, checksummed end to end, resumable, with dependency-aware retention."
repository = "https://github.com/myst3k/zfsbackup-rs"
keywords = ["zfs", "backup", "s3", "snapshot"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
blake3 = { version = "1", features = ["rayon"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc-fast = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
object_store = { version = "0.12", features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
